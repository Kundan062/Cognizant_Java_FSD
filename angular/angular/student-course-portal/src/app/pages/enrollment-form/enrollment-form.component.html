<h2>Enrollment Request (Template-Driven Form)</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
  <div>
    <label>Student Name</label>
    <input name="studentName" [(ngModel)]="studentName" required minlength="3" #nameCtrl="ngModel" />
    <span class="err" *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">Name is required</span>
    <span class="err" *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">Name must be at least 3 characters</span>
  </div>

  <div>
    <label>Email</label>
    <input name="studentEmail" type="email" [(ngModel)]="studentEmail" required email #emailCtrl="ngModel" />
    <span class="err" *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">Email is required</span>
    <span class="err" *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">Enter a valid email</span>
  </div>

  <div>
    <label>Course ID</label>
    <input name="courseId" type="number" [(ngModel)]="courseId" required />
  </div>

  <div>
    <label>Preferred Semester</label>
    <select name="preferredSemester" [(ngModel)]="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div>
    <label><input type="checkbox" name="agreeToTerms" [(ngModel)]="agreeToTerms" required /> I agree to the terms</label>
  </div>

  <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
  <button type="button" (click)="enrollForm.resetForm()">Reset</button>

  <p class="success" *ngIf="submitted">Enrollment request submitted successfully!</p>
</form>
