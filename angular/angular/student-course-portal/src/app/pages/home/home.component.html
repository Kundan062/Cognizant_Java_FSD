<h1>{{ portalName }}</h1>
<p>Welcome back! Track your courses, grades, and enrollment status all in one place.</p>

<div class="stats">
  <div><strong>{{ coursesAvailable }}</strong><span>Courses Available</span></div>
  <div><strong>{{ enrolledCount }}</strong><span>Enrolled</span></div>
  <div><strong>{{ gpa }}</strong><span>GPA</span></div>
</div>

<button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
<p *ngIf="message">{{ message }}</p>

<div class="search">
  <input [(ngModel)]="searchTerm" placeholder="Search courses..." />
  <p>Searching for: {{ searchTerm }}</p>
</div>
