# Exercise 9: H2 in-memory database connection
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate auto-create/update the schema from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console (handy for eyeballing data): http://localhost:8080/h2-console
# JDBC URL to use when logging into the console: jdbc:h2:mem:librarydb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
