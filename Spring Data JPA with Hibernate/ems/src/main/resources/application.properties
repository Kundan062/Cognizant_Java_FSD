# ==========================================================
# Exercise 1: Configuring Application Properties (H2 database)
# ==========================================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Let Hibernate create the schema from the entities on startup (demo/H2 in-memory)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# Exercise 9: Spring Boot Auto-Configuration / Externalizing Configuration
# Spring Boot auto-configures the DataSource, EntityManagerFactory and
# TransactionManager purely from these externalized properties - no manual
# DataSource bean is required for the primary datasource.
# (See DataSourceConfig.java for the pattern to add a SECOND datasource.)
# ==========================================================
app.datasource.secondary.enabled=false
app.datasource.secondary.url=jdbc:h2:mem:reportingdb
app.datasource.secondary.driverClassName=org.h2.Driver
app.datasource.secondary.username=sa
app.datasource.secondary.password=password

# ==========================================================
# Exercise 10: Hibernate-specific dialect & performance properties
# ==========================================================
# Batch processing - group inserts/updates into JDBC batches
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
# Generate statistics so batching can be observed/verified
spring.jpa.properties.hibernate.generate_statistics=false

# H2 console (handy for inspecting data manually during the hands-on)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
